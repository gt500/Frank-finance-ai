# Runs on every pull request and on master: lint, tests and a production build.
name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frank-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frank-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frank-app
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test -A --node-modules-dir=none supabase/functions
